# Blueprint لـRender: خدمة ويب وعامل من صورة Docker واحدة. النشر التلقائي معطل (autoDeployTrigger: off).
#
# الأسرار: Render لا يقبل «sync: false» داخل مجموعة متغيرات، لذلك تُعرَّف على خدمة الويب فقط
# (تطلبها لوحة Render مرة واحدة عند إنشاء الـBlueprint)، والعامل ينسخ قيمها بـfromService/envVarKey.
# المتغيرات التي تُضاف لاحقًا (OUTBOUND_ENABLED، OUTBOUND_ALLOWLIST، HOSTINGER_WEBHOOK_SECRET) تُضاف
# من اللوحة إلى مجموعة sales-agent-shared؛ Render يحفظ ما يُضاف من اللوحة ولا يمسحه عند مزامنة الـBlueprint.
# غيابها = القيمة الآمنة: الإرسال الحقيقي مغلق.
#
# لا خدمة cron: العامل يجدول المهام بنفسه كل دقيقة ويستعيد المهام المعلقة.
# الخطة 0.5c-512mb هي «Starter» سابقًا (أعادت Render تسمية الخطط في أغسطس 2026؛ الاسم القديم ما زال مقبولًا).
# قاعدة البيانات: Supabase (Session pooler)؛ انظر docs/runbooks/launch-guide.md.

envVarGroups:
  - name: sales-agent-shared
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Riyadh

services:
  - type: web
    name: sales-agent-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - fromGroup: sales-agent-shared
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DATA_HASH_KEY
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false

  - type: worker
    name: sales-agent-worker
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    dockerCommand: python -m app.jobs.worker
    envVars:
      - fromGroup: sales-agent-shared
      - key: APP_BASE_URL
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: APP_BASE_URL
      - key: DATABASE_URL
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: DATABASE_URL
      - key: SUPABASE_URL
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_PUBLISHABLE_KEY
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: SESSION_SECRET
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: SESSION_SECRET
      - key: DATA_HASH_KEY
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: DATA_HASH_KEY
      - key: SECRETS_ENCRYPTION_KEY
        fromService:
          type: web
          name: sales-agent-web
          envVarKey: SECRETS_ENCRYPTION_KEY
