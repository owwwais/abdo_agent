# بديل Docker للتشغيل المحلي (Linux/macOS أو Windows مع Docker). بدون Docker استخدم scripts/localdb.py.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sales
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/compose-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sales
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build: .
    command: ["python", "-m", "app.jobs.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/sales
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
